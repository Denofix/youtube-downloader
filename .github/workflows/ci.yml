name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container: python:3.12-bookworm
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - name: Install locked dependencies and media tools
        timeout-minutes: 5
        run: |
          apt-get -o Acquire::Retries=2 update --error-on=any
          apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg chromium
          uv sync --frozen --all-groups
      - name: Backend checks
        run: |
          uv run --no-sync ruff check backend tests scripts
          uv run --no-sync ruff format --check backend tests scripts
          uv run --no-sync pytest -q
          uv export --no-header --frozen --no-dev --no-group ui --format requirements-txt --output-file /tmp/requirements.txt
          diff requirements.txt /tmp/requirements.txt
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm run format:check
          npm run build
      - name: Real browser integration and screenshots
        run: |
          uv run --no-sync python scripts/check_ui.py --chromium /usr/bin/chromium
          uv run --no-sync python scripts/check_photos_ui.py --chromium /usr/bin/chromium
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: ui-screenshots
          path: .ui-artifacts/*.png
          include-hidden-files: true
          if-no-files-found: ignore

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start the production stack
        run: |
          docker compose config --quiet
          docker compose up --build -d --wait
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/
          docker compose exec -T worker node --version
          docker compose exec -T worker python -m service.diagnostics --runtime-only
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop the disposable stack
        if: always()
        run: docker compose down -v
